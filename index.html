<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알까기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #3d3129, #1c1714);
    color: #f3e9dc; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 0 16px 24px;
  }
  h1 { margin: 18px 0 6px; font-size: 30px; letter-spacing: 6px; }
  #hud { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 6px 0 10px; }
  .score { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.08); font-weight: bold; }
  .score.active { background: rgba(255,214,120,.25); box-shadow: 0 0 0 2px #ffd678 inset; }
  .dot { width: 18px; height: 18px; border-radius: 50%; }
  .dot.w { background: radial-gradient(circle at 35% 30%, #fff, #cfcfcf); }
  .dot.b { background: radial-gradient(circle at 35% 30%, #777, #111); border: 1px solid #555; }
  #status { min-height: 24px; margin-bottom: 8px; text-align: center; font-size: 15px; color: #ffe9b8; }
  #wrap { position: relative; width: min(640px, 100%); }
  canvas { display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.6); touch-action: none; }
  #power { width: min(640px, 100%); height: 12px; margin-top: 10px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; }
  #powerBar { height: 100%; width: 0; background: linear-gradient(90deg, #5fd35f, #ffd23f, #ff4b3a); transition: width .03s; }
  #controls { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-weight: bold; padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer;
    background: #c8923f; color: #2b1d0e; box-shadow: 0 3px 0 #7a5521;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .4; cursor: not-allowed; filter: none; }
  button.sub { background: #5a4a3c; color: #f3e9dc; box-shadow: 0 3px 0 #2e251d; }
  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: rgba(0,0,0,.55); border-radius: 10px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 44px; text-shadow: 0 4px 12px #000; }
  .help { margin-top: 14px; font-size: 13px; color: #bfae98; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <h1>알까기</h1>
  <div id="hud">
    <div class="score" id="scoreW"><span class="dot w"></span>나 (백) <span id="cntW">0</span></div>
    <div class="score" id="scoreB"><span class="dot b"></span>컴퓨터 (흑) <span id="cntB">0</span></div>
  </div>
  <div id="status"></div>
  <div id="wrap">
    <canvas id="board" width="640" height="640"></canvas>
    <div id="overlay"><h2 id="resultText"></h2><button id="btnAgain">다시 하기</button></div>
  </div>
  <div id="power"><div id="powerBar"></div></div>
  <div id="controls">
    <button class="sub" id="btnRandom">남은 돌 랜덤 배치</button>
    <button class="sub" id="btnClear">배치 초기화</button>
    <button id="btnStart" disabled>게임 시작</button>
    <button class="sub" id="btnRestart">새 게임</button>
  </div>
  <div class="help">
    ① 아래쪽 영역을 클릭해 백돌 10개를 놓으세요 (놓은 돌을 다시 클릭하면 제거)<br>
    ② 내 차례에 백돌을 누른 채 <b>쏠 방향의 반대쪽으로 당겼다가 놓으면</b> 발사! 당긴 거리만큼 세게 나갑니다<br>
    ③ 판 밖으로 떨어진 돌은 사라지고, 상대 돌을 모두 떨어뜨리면 승리
  </div>

<script>
const $ = id => document.getElementById(id);
const cv = $('board'), ctx = cv.getContext('2d');
const W = 640, H = 640, B = { x: 34, y: 34, w: 572, h: 572 };
const MID = B.y + B.h / 2;
const R = 17, N = 10;
const MAXV = 24, DECEL = 0.12, REST = 0.9, SUB = 4;   // 속도 단위: px/frame
const MAXDRAG = 150, FALL_FRAMES = 28, AI_AIM_FRAMES = 50;
const ZONE = { b: [B.y + R + 6, MID - R - 10], w: [MID + R + 10, B.y + B.h - R - 6] };

let stones, phase, state, turn, drag = null, aiAim = null, hover = null;

const rand = (a, b) => a + Math.random() * (b - a);
const mk = (x, y, color) => ({ x, y, vx: 0, vy: 0, color, fall: 0, alive: true });
const active = c => stones.filter(s => s.alive && !s.fall && (!c || s.color === c));

function canPlace(x, y, color) {
  const [minY, maxY] = ZONE[color];
  if (x < B.x + R + 4 || x > B.x + B.w - R - 4 || y < minY || y > maxY) return false;
  return stones.every(s => Math.hypot(s.x - x, s.y - y) >= 2 * R + 4);
}

function randomFill(color, count) {
  const [minY, maxY] = ZONE[color];
  for (let tries = 0; count > 0 && tries < 5000; tries++) {
    const x = rand(B.x + R + 4, B.x + B.w - R - 4), y = rand(minY, maxY);
    if (canPlace(x, y, color)) { stones.push(mk(x, y, color)); count--; }
  }
}

function newGame() {
  stones = [];
  randomFill('b', N);
  phase = 'setup'; state = null; turn = null; drag = aiAim = null;
  $('overlay').classList.remove('show');
  updateUI();
}

function startGame() {
  phase = 'play'; turn = 'w'; state = 'aim';
  updateUI();
}

function updateUI() {
  const w = stones.filter(s => s.alive && s.color === 'w').length;
  const b = stones.filter(s => s.alive && s.color === 'b').length;
  $('cntW').textContent = w; $('cntB').textContent = b;
  $('scoreW').classList.toggle('active', turn === 'w');
  $('scoreB').classList.toggle('active', turn === 'b');
  const setup = phase === 'setup';
  $('btnRandom').style.display = $('btnClear').style.display = $('btnStart').style.display = setup ? '' : 'none';
  $('btnStart').disabled = w < N;
  $('btnRandom').disabled = w >= N;
  let msg = '';
  if (setup) msg = w < N ? `백돌을 놓을 위치를 클릭하세요 (${w}/${N})` : '배치 완료! [게임 시작]을 누르세요';
  else if (phase === 'over') msg = '게임 종료';
  else if (state === 'aim') msg = '내 차례 — 백돌을 잡고 뒤로 당겼다 놓으세요';
  else if (state === 'ai') msg = '컴퓨터가 조준 중...';
  else if (state === 'moving') msg = turn === 'w' ? '발사!' : '컴퓨터 발사!';
  $('status').textContent = msg;
}

function gameOver(result) {
  phase = 'over'; state = null; turn = null;
  $('resultText').textContent = { win: '승리! 🎉', lose: '패배...', draw: '무승부' }[result];
  $('overlay').classList.add('show');
  updateUI();
}

// ---------- 사운드 ----------
let actx = null, lastSound = 0;
function clack(vol) {
  const now = performance.now();
  if (now - lastSound < 30) return;
  lastSound = now;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(1900, t);
    o.frequency.exponentialRampToValueAtTime(500, t + 0.05);
    g.gain.setValueAtTime(Math.min(0.35, vol), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + 0.09);
  } catch (e) {}
}

// ---------- 물리 ----------
function collide(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d >= 2 * R || d === 0) return;
  const nx = dx / d, ny = dy / d, overlap = (2 * R - d) / 2;
  a.x -= nx * overlap; a.y -= ny * overlap;
  b.x += nx * overlap; b.y += ny * overlap;
  const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rv >= 0) return;
  const j = -(1 + REST) * rv / 2;
  a.vx -= j * nx; a.vy -= j * ny;
  b.vx += j * nx; b.vy += j * ny;
  if (-rv > 0.5) clack(-rv / 40);
}

function step() {
  for (let k = 0; k < SUB; k++) {
    const act = active();
    for (const s of act) {
      s.x += s.vx / SUB; s.y += s.vy / SUB;
      const sp = Math.hypot(s.vx, s.vy), dec = DECEL / SUB;
      if (sp <= dec) { s.vx = s.vy = 0; }
      else { const f = (sp - dec) / sp; s.vx *= f; s.vy *= f; }
    }
    for (let i = 0; i < act.length; i++)
      for (let j = i + 1; j < act.length; j++) collide(act[i], act[j]);
    for (const s of act)
      if (s.x < B.x || s.x > B.x + B.w || s.y < B.y || s.y > B.y + B.h) s.fall = 1;
  }
  for (const s of stones) {
    if (!s.alive || !s.fall) continue;
    s.x += s.vx * 0.6; s.y += s.vy * 0.6; s.vx *= 0.9; s.vy *= 0.9;
    if (++s.fall > FALL_FRAMES) s.alive = false;
  }

  if (aiAim && ++aiAim.t >= AI_AIM_FRAMES) shoot(aiAim.s, aiAim.ux * aiAim.v, aiAim.uy * aiAim.v);

  if (state === 'moving' && stones.every(s => !s.alive || (!s.fall && s.vx === 0 && s.vy === 0))) endTurn();
}

function shoot(s, vx, vy) {
  s.vx = vx; s.vy = vy;
  drag = aiAim = null;
  state = 'moving';
  $('powerBar').style.width = '0';
  updateUI();
}

function endTurn() {
  stones = stones.filter(s => s.alive);
  const w = active('w').length, b = active('b').length;
  if (!w || !b) { gameOver(!w && !b ? 'draw' : !b ? 'win' : 'lose'); return; }
  turn = turn === 'w' ? 'b' : 'w';
  if (turn === 'b') { state = 'ai'; setTimeout(aiThink, 450); }
  else state = 'aim';
  updateUI();
}

// ---------- 컴퓨터 AI ----------
// 점 p에서 방향 u로 판 가장자리까지의 거리
function edgeDist(px, py, ux, uy) {
  let t = Infinity;
  if (ux > 0) t = Math.min(t, (B.x + B.w - px) / ux);
  if (ux < 0) t = Math.min(t, (B.x - px) / ux);
  if (uy > 0) t = Math.min(t, (B.y + B.h - py) / uy);
  if (uy < 0) t = Math.min(t, (B.y - py) / uy);
  return t;
}

// 선분 위에 다른 돌이 몇 개나 가로막는지
function blockers(px, py, ux, uy, len, skip) {
  let n = 0;
  for (const s of active()) {
    if (skip.includes(s)) continue;
    const t = (s.x - px) * ux + (s.y - py) * uy;
    if (t <= 0 || t >= len) continue;
    const perp = Math.abs((s.x - px) * uy - (s.y - py) * ux);
    if (perp < 2 * R) n++;
  }
  return n;
}

function aiThink() {
  if (phase !== 'play') return;
  let best = null;
  for (const b of active('b')) {
    for (const w of active('w')) {
      const dx = w.x - b.x, dy = w.y - b.y, d = Math.hypot(dx, dy);
      const ux = dx / d, uy = dy / d;
      const de = edgeDist(w.x, w.y, ux, uy);
      const score = d + de * 0.7
        + blockers(b.x, b.y, ux, uy, d, [b, w]) * 400
        + blockers(w.x, w.y, ux, uy, de, [b, w]) * 150
        + Math.random() * 60;
      if (!best || score < best.score) best = { score, b, w, d, de, ux, uy };
    }
  }
  if (!best) return;
  // 등가속 감속 모델: 이동거리 = v² / (2a)
  const share = (1 + REST) / 2;                       // 충돌 시 상대에게 전달되는 속도 비율
  const vImpact = Math.sqrt(2 * DECEL * (best.de + R * 2)) / share;
  let v = Math.sqrt(vImpact ** 2 + 2 * DECEL * Math.max(0, best.d - 2 * R));
  v = Math.min(MAXV, v * rand(1.0, 1.3));
  const ang = Math.atan2(best.uy, best.ux) + rand(-0.05, 0.05);
  aiAim = { s: best.b, ux: Math.cos(ang), uy: Math.sin(ang), v, t: 0 };
}

// ---------- 입력 ----------
function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const stoneAt = (p, color) => active(color).find(s => Math.hypot(s.x - p.x, s.y - p.y) < R * 1.35);

cv.addEventListener('pointerdown', e => {
  const p = pos(e);
  if (phase === 'setup') {
    const hit = stoneAt(p, 'w');
    if (hit) stones.splice(stones.indexOf(hit), 1);
    else if (stones.filter(s => s.color === 'w').length < N && canPlace(p.x, p.y, 'w')) stones.push(mk(p.x, p.y, 'w'));
    updateUI();
    return;
  }
  if (phase === 'play' && state === 'aim' && turn === 'w') {
    const s = stoneAt(p, 'w');
    if (s) { drag = { s, px: p.x, py: p.y }; cv.setPointerCapture(e.pointerId); }
  }
});

cv.addEventListener('pointermove', e => {
  const p = pos(e);
  hover = p;
  if (drag) {
    drag.px = p.x; drag.py = p.y;
    const len = Math.hypot(drag.s.x - p.x, drag.s.y - p.y);
    $('powerBar').style.width = Math.min(100, len / MAXDRAG * 100) + '%';
  }
  const grabbable = phase === 'play' && state === 'aim' && stoneAt(p, 'w');
  cv.style.cursor = drag ? 'grabbing' : grabbable ? 'grab' : phase === 'setup' ? 'crosshair' : 'default';
});

cv.addEventListener('pointerup', () => {
  if (!drag) return;
  const dx = drag.s.x - drag.px, dy = drag.s.y - drag.py, len = Math.hypot(dx, dy);
  if (len < 10) { drag = null; $('powerBar').style.width = '0'; return; }
  const v = Math.min(len, MAXDRAG) / MAXDRAG * MAXV;
  shoot(drag.s, dx / len * v, dy / len * v);
});

cv.addEventListener('pointercancel', () => { drag = null; $('powerBar').style.width = '0'; });

$('btnRandom').onclick = () => { randomFill('w', N - stones.filter(s => s.color === 'w').length); updateUI(); };
$('btnClear').onclick = () => { stones = stones.filter(s => s.color !== 'w'); updateUI(); };
$('btnStart').onclick = startGame;
$('btnRestart').onclick = newGame;
$('btnAgain').onclick = newGame;

// ---------- 그리기 ----------
function drawBoard() {
  ctx.fillStyle = '#5b3a1e';
  ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(B.x, B.y, B.x + B.w, B.y + B.h);
  g.addColorStop(0, '#e8c27a'); g.addColorStop(0.5, '#dcae62'); g.addColorStop(1, '#cf9f52');
  ctx.fillStyle = g;
  ctx.fillRect(B.x, B.y, B.w, B.h);

  // 나뭇결
  ctx.strokeStyle = 'rgba(120,70,20,.08)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const y0 = B.y + i * B.h / 14 + 10;
    ctx.beginPath();
    for (let x = B.x; x <= B.x + B.w; x += 16) ctx.lineTo(x, y0 + Math.sin(x / 47 + i) * 6);
    ctx.stroke();
  }

  // 바둑판 격자
  const pad = 16, gw = B.w - pad * 2, step = gw / 18;
  ctx.strokeStyle = 'rgba(40,25,10,.55)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 19; i++) {
    const t = B.x + pad + i * step;
    ctx.beginPath(); ctx.moveTo(t, B.y + pad); ctx.lineTo(t, B.y + B.h - pad); ctx.stroke();
    const u = B.y + pad + i * step;
    ctx.beginPath(); ctx.moveTo(B.x + pad, u); ctx.lineTo(B.x + B.w - pad, u); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(40,25,10,.7)';
  for (const i of [3, 9, 15]) for (const j of [3, 9, 15]) {
    ctx.beginPath(); ctx.arc(B.x + pad + i * step, B.y + pad + j * step, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  ctx.strokeStyle = '#3a2410';
  ctx.lineWidth = 4;
  ctx.strokeRect(B.x, B.y, B.w, B.h);

  if (phase === 'setup') {
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.fillRect(B.x, ZONE.w[0] - R, B.w, ZONE.w[1] - ZONE.w[0] + 2 * R);
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    ctx.fillRect(B.x, B.y, B.w, MID - B.y);
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = 'rgba(80,30,0,.6)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(B.x, MID); ctx.lineTo(B.x + B.w, MID); ctx.stroke();
    ctx.setLineDash([]);
    if (hover && stones.filter(s => s.color === 'w').length < N && canPlace(hover.x, hover.y, 'w')) {
      ctx.globalAlpha = 0.45; drawStone({ x: hover.x, y: hover.y, color: 'w', fall: 0 }); ctx.globalAlpha = 1;
    }
  }
}

function drawStone(s) {
  let scale = 1, alpha = 1;
  if (s.fall) { const t = s.fall / FALL_FRAMES; scale = 1 - t * 0.7; alpha = 1 - t; }
  const r = R * scale;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.arc(s.x + 3 * scale, s.y + 4 * scale, r, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createRadialGradient(s.x - r * 0.35, s.y - r * 0.4, r * 0.1, s.x, s.y, r);
  if (s.color === 'w') { g.addColorStop(0, '#ffffff'); g.addColorStop(0.7, '#e9e9e4'); g.addColorStop(1, '#b9b9b2'); }
  else { g.addColorStop(0, '#6a6a6a'); g.addColorStop(0.4, '#262626'); g.addColorStop(1, '#050505'); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawArrow(s, ux, uy, power) {
  const len = R + 18 + power * 130;
  const ex = s.x + ux * len, ey = s.y + uy * len;
  const hue = 120 - power * 120;
  ctx.save();
  // 진행 방향 가이드
  ctx.setLineDash([4, 8]);
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(s.x + ux * (len + 160), s.y + uy * (len + 160)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = ctx.fillStyle = `hsl(${hue}, 90%, 50%)`;
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(s.x + ux * (R + 4), s.y + uy * (R + 4)); ctx.lineTo(ex, ey); ctx.stroke();
  const a = Math.atan2(uy, ux);
  ctx.beginPath();
  ctx.moveTo(ex + Math.cos(a) * 14, ey + Math.sin(a) * 14);
  ctx.lineTo(ex + Math.cos(a + 2.4) * 14, ey + Math.sin(a + 2.4) * 14);
  ctx.lineTo(ex + Math.cos(a - 2.4) * 14, ey + Math.sin(a - 2.4) * 14);
  ctx.closePath(); ctx.fill();
  ctx.font = 'bold 15px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 3;
  const label = Math.round(power * 100) + '%';
  ctx.strokeText(label, ex + 12, ey - 12); ctx.fillText(label, ex + 12, ey - 12);
  ctx.restore();
}

function draw() {
  drawBoard();
  const list = stones.filter(s => s.alive);
  list.filter(s => s.fall).forEach(drawStone);
  list.filter(s => !s.fall).forEach(drawStone);

  // 내 차례에 잡을 수 있는 돌 표시
  if (phase === 'play' && state === 'aim' && !drag) {
    ctx.strokeStyle = 'rgba(255,214,120,.7)'; ctx.lineWidth = 2;
    for (const s of active('w')) { ctx.beginPath(); ctx.arc(s.x, s.y, R + 4, 0, Math.PI * 2); ctx.stroke(); }
  }

  if (drag) {
    const dx = drag.s.x - drag.px, dy = drag.s.y - drag.py, len = Math.hypot(dx, dy);
    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(drag.s.x, drag.s.y); ctx.lineTo(drag.px, drag.py); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(drag.px, drag.py, 5, 0, Math.PI * 2); ctx.fill();
    if (len >= 10) drawArrow(drag.s, dx / len, dy / len, Math.min(len, MAXDRAG) / MAXDRAG);
  }

  if (aiAim) {
    const grow = Math.min(1, aiAim.t / (AI_AIM_FRAMES * 0.7));
    drawArrow(aiAim.s, aiAim.ux, aiAim.uy, (aiAim.v / MAXV) * grow);
    $('powerBar').style.width = (aiAim.v / MAXV * grow * 100) + '%';
  }
}

// 고정 시간 간격(60Hz) 루프
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}

newGame();
requestAnimationFrame(loop);
</script>
